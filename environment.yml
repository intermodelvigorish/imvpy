# Reproducible Miniforge environment for developing the package and running the
# examples. pyproject.toml remains the authority on the library's own dependency
# ranges; this file pins the wider toolchain the notebooks and test suite need.
#
#   conda env create -f environment.yml
#   conda activate imv
name: imv
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Library runtime
  - numpy=1.26
  - pandas>=2.0,<3
  - scipy>=1.11,<2
  - scikit-learn>=1.4,<2
  - matplotlib>=3.8,<4
  - seaborn>=0.13,<1
  - joblib>=1.3,<2
  - tqdm>=4.66,<5
  - tqdm-joblib>=0.0.4
  # Estimator families compared in every example
  - xgboost>=2
  - lightgbm>=4
  # Deep-learning extra, for the IMDb ablation example
  - pytorch>=2
  # Notebooks
  - jupyter>=1
  - nbclient>=0.8
  - nbformat>=5.9
  # Test suite: pyyaml is required by tests/test_settings_contract.py
  - pytest>=8
  - pytest-cov>=5
  - pyyaml>=6
  # Lint
  - ruff>=0.5
  - pip
  - pip:
      # Downloaders used by the examples; not conda-forge packages.
      - ucimlrepo>=0.0.3
      # transformers/datasets are needed only by examples/ablation_imv:
      #   pip install ".[examples-deep-learning]"
      - -e .
