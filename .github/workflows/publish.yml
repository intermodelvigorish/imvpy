name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c "import os, pathlib, re;
          text = pathlib.Path('pyproject.toml').read_text();
          version = re.search(r'^version = \"([^\"]+)\"', text, re.MULTILINE).group(1);
          expected = f'v{version}'; actual = os.environ['RELEASE_TAG'];
          assert actual == expected, f'release tag {actual!r} must equal {expected!r}'"
      - run: python -m pip install ".[test,release]" ruff
      - run: ruff check .
      - run: python -m pytest --quiet
      - run: check-manifest
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: check-wheel-contents dist/*.whl
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/imvpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
