[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imv"
version = "1.2.0"
description = "InterModel Vigorish for probabilistic model comparison and feature attribution"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Valler Y."}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5,<3",
  "scipy>=1.9,<2",
  "scikit-learn>=1.2,<2",
  "matplotlib>=3.6,<4",
  # 0.13 is the floor for the hue=/legend= plotting API used in shap_imv.
  "seaborn>=0.13,<1",
  "joblib>=1.2,<2",
  "tqdm>=4.64,<5",
]

[project.optional-dependencies]
progress = ["tqdm-joblib>=0.0.4"]
deep-learning = ["torch>=2"]
test = ["pytest>=7", "pytest-cov>=4", "pyyaml>=6"]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.30,<1",
]
dev = [
  "imv[progress,test,docs]",
  "build>=1",
  "ruff>=0.5",
  "mypy>=1.8",
]

[project.urls]
Documentation = "https://intermodelvigorish.github.io/PyIMV/"
Repository = "https://github.com/intermodelvigorish/PyIMV"
Issues = "https://github.com/intermodelvigorish/PyIMV/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/imv"]

[tool.coverage.report]
show_missing = true
fail_under = 55

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["build", "documentation"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long lines survive only in the wide reference tables inside docstrings, where
# wrapping would break the table. Everything else is kept under the limit.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_core_unit.py" = ["B905"]
