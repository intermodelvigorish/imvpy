[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "imvpy"
version = "1.2.0"
description = "InterModel Vigorish for probabilistic model comparison and attribution"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Valler Y."}]
maintainers = [{name = "Charles Rahal"}]
keywords = [
  "ablation",
  "classification",
  "feature attribution",
  "intermodel vigorish",
  "machine learning",
  "model comparison",
  "predictive accuracy",
  "shapley values",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5,<3",
  "scipy>=1.9,<2",
  "scikit-learn>=1.2,<2",
  "matplotlib>=3.6,<4",
  # 0.13 is the floor for the hue=/legend= plotting API used in shap_imv.
  "seaborn>=0.13,<1",
  "joblib>=1.2,<2",
  "tqdm>=4.64,<5",
]

[project.optional-dependencies]
progress = ["tqdm-joblib>=0.0.4"]
deep-learning = ["torch>=2"]
test = [
  "pytest>=7",
  "pytest-cov>=4",
  "pyyaml>=6",
  "tomli>=2; python_version < '3.11'",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.30,<1",
]
release = [
  "build>=1",
  "check-manifest>=0.50",
  "check-wheel-contents>=0.6",
  "twine>=6",
]
dev = [
  "imvpy[progress,test,docs,release]",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/intermodelvigorish/imvpy"
Documentation = "https://intermodelvigorish.github.io/imvpy/"
Repository = "https://github.com/intermodelvigorish/imvpy"
Issues = "https://github.com/intermodelvigorish/imvpy/issues"
Changelog = "https://github.com/intermodelvigorish/imvpy/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["imvpy*"]
namespaces = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/imvpy"]

[tool.coverage.report]
show_missing = true
fail_under = 55

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["build", "documentation"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long lines survive only in the wide reference tables inside docstrings, where
# wrapping would break the table. Everything else is kept under the limit.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_core_unit.py" = ["B905"]

[tool.check-manifest]
ignore = [
  ".github/**",
  ".gitignore",
  "environment.yml",
]
